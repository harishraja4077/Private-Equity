<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Create Account Stackly</title>
<meta name="description" content="Create an investor account with Stackly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="preloader"><div class="loader-mark">Stackly</div><div class="loader-bar"></div></div>

<main>
 <!-- 1 | AUTH -->
 <section class="auth">
 <div class="auth-side">
 <div class="bg"><img src="Assets/hero-main.webp" alt="City skyline through glass"></div>
 <div class="top">
 <a href="index.html" class="brand"><img src="Assets/logo.webp" alt="Stackly" class="brand-logo"></a>
 </div>
 <div class="auth-quote">
 <blockquote>"We don't invest in companies. We invest in the people who build them."</blockquote>
 <p class="who" style="color:var(--gold-400);font-weight:700">Elena Vos, Partner</p>
 </div>
 </div>
 <div class="auth-form-side">
<div class="auth-card" data-reveal>
 <a href="index.html" class="auth-back">&#8592; Back to Home</a>
 <a href="index.html" class="brand" style="justify-content:center;margin-bottom:1.8rem"><img src="Assets/logo.webp" alt="Stackly" class="brand-logo"></a>
 <h1>Create Account</h1>
 <p class="sub">Join founders and LPs on the Stackly platform</p>
<div class="role-switch" role="tablist" aria-label="Account type">
 <button type="button" class="active" data-role="user">Investor</button>
 <button type="button" data-role="admin">Admin</button>
 </div>
 <form data-demo data-auth-form novalidate style="display:grid;gap:1rem">
 <input type="hidden" name="role" value="user">
 <div class="form-grid">
 <div class="field"><label for="su-fname">First Name</label><input class="input" id="su-fname" type="text" required placeholder="Jane"></div>
 <div class="field"><label for="su-lname">Last Name</label><input class="input" id="su-lname" type="text" required placeholder="L renz"></div>
 </div>
 <div class="field"><label for="su-email">Business Email</label><input class="input" id="su-email" type="email" required placeholder="jane@gmail.com"></div>
 <div class="field">
 <label for="su-pass">Create Password</label>
 <div class="pw-wrap"><input class="input" id="su-pass" type="password" required placeholder="8+ characters"><button type="button" class="pw-toggle" aria-label="Toggle password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
 </div>
 <label class="check-row"><input type="checkbox" required> I agree to the <a href="404.html" style="color:var(--gold-600);font-weight:700">Terms of Service</a> and <a href="404.html" style="color:var(--gold-600);font-weight:700">Privacy Policy</a>.</label>
 <button class="btn btn-primary" type="submit">Create Account <span class="arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></span></button>
 </form>
 <div class="auth-divider">or sign up with</div>
 <div class="social-row">
 <button class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Google</button>
 <button class="social-btn"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.7 12.84c-.02-2.27 1.86-3.36 1.94-3.41-1.06-1.55-2.71-1.76-3.3-1.78-1.4-.14-2.74.83-3.45.83-.71 0-1.81-.81-2.97-.79-1.53.02-2.94.89-3.72 2.26-1.59 2.76-.41 6.85 1.14 9.08.76 1.1 1.66 2.34 2.85 2.3 1.14-.05 1.57-.74 2.95-.74 1.38 0 1.77.74 2.97.72 1.23-.02 2.01-1.12 2.76-2.23.87-1.27 1.23-2.5 1.25-2.56-.03-.01-2.4-.92-2.42-3.68zM14.03 5.55c.63-.76 1.06-1.82.94-2.87-.91.04-2.01.61-2.66 1.37-.58.68-1.09 1.77-.96 2.81 1.02.08 2.05-.52 2.68-1.31z"/></svg> Apple</button>
 </div>
 <p class="auth-alt">Already have an account? <a href="signin.html">Sign in</a></p>
 </div>
 </div>
 </section>
</main>
<script src="js/main.js"></script>
</body>
</html>
